<svg viewBox="0 0 680 342" width="100%" role="img" xmlns="http://www.w3.org/2000/svg"><title>Two-key authority model for the gstack plus domain agent team</title><desc>gstack roles hold process authority, the two domain agents hold physics authority, both feed the gate chain, and physics wins on conflict.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g><rect x="40" y="40" width="280" height="76" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/><text x="180" y="66" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">gstack orchestration</text><text x="180" y="86" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">CEO · PM · Engineer · QC · DevOps</text><text x="180" y="103" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">process authority</text></g><g><rect x="360" y="40" width="280" height="76" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="500" y="66" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Two domain agents</text><text x="500" y="86" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">AI GDS-Architect · Analog IC Architect</text><text x="500" y="103" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">physics authority</text></g><path d="M180 116 L180 146 Q180 162 200 168 L288 172" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow-blue)"/><path d="M500 116 L500 146 Q500 162 480 168 L392 172" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow-green)"/><text x="340" y="150" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">on conflict, physics wins</text><g><rect x="170" y="182" width="340" height="64" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="340" y="206" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Gate chain — neutral referee</text><text x="340" y="226" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Magic · Netgen · SKY130A · Microlane</text></g><g><rect x="40" y="270" width="600" height="52" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/><text x="340" y="288" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#791F1F">"PASS" is a string. The log is the evidence.</text><text x="340" y="307" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">Domain agent reads the log · QC reports the status · human signs</text></g></svg>
